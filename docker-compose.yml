services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tcc-app:latest
    container_name: tcc_app
    restart: unless-stopped
    networks:
      - tcc_net

  webserver:
    image: nginx:alpine
    container_name: tcc_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tcc_net

networks:
  tcc_net:
    driver: bridge
